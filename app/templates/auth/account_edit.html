{% extends "base.html" %}
{% block title %}Edit profile — The Spice & Roast Co.{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto py-12">
    <h1 class="font-display text-4xl text-coffee-dark mb-8">Edit profile</h1>
    <form method="POST" class="bg-white border border-coffee-dark/8 rounded-sm p-8 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-[11px] tracking-widest uppercase text-coffee-light mb-1">Email</label>
            <input type="email" value="{{ current_user.email }}" disabled
                   class="w-full border border-coffee-dark/10 rounded-sm px-3 py-2 bg-parchment text-coffee-light">
            <p class="text-xs text-coffee-light mt-1 italic">Email can't be changed here.</p>
        </div>

        <div>
            <label class="block text-[11px] tracking-widest uppercase text-coffee-light mb-1">Full name</label>
            <input type="text" name="full_name" value="{{ current_user.full_name or '' }}"
                   class="w-full border border-coffee-dark/20 rounded-sm px-3 py-2 bg-cream">
        </div>
        <div>
            <label class="block text-[11px] tracking-widest uppercase text-coffee-light mb-1">Phone</label>
            <input type="text" name="phone" value="{{ current_user.phone or '' }}"
                   class="w-full border border-coffee-dark/20 rounded-sm px-3 py-2 bg-cream">
        </div>
        <div>
            <label class="block text-[11px] tracking-widest uppercase text-coffee-light mb-1">Address</label>
            <input type="text" name="address_line" value="{{ current_user.address_line or '' }}"
                   class="w-full border border-coffee-dark/20 rounded-sm px-3 py-2 bg-cream">
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-[11px] tracking-widest uppercase text-coffee-light mb-1">City</label>
                <input type="text" name="city" value="{{ current_user.city or '' }}"
                       class="w-full border border-coffee-dark/20 rounded-sm px-3 py-2 bg-cream">
            </div>
            <div>
                <label class="block text-[11px] tracking-widest uppercase text-coffee-light mb-1">Postal code</label>
                <input type="text" name="postal_code" value="{{ current_user.postal_code or '' }}"
                       class="w-full border border-coffee-dark/20 rounded-sm px-3 py-2 bg-cream">
            </div>
        </div>
        <div>
            <label class="block text-[11px] tracking-widest uppercase text-coffee-light mb-1">Country</label>
            <input type="text" name="country" value="{{ current_user.country or '' }}"
                   class="w-full border border-coffee-dark/20 rounded-sm px-3 py-2 bg-cream">
        </div>

        <div class="flex items-center justify-between pt-4">
            <a href="{{ url_for('auth.account') }}" class="text-xs tracking-widest uppercase text-coffee-light hover:text-coffee-dark">Cancel</a>
            <button type="submit" class="btn-primary">Save changes</button>
        </div>
    </form>
</div>
{% endblock %}
