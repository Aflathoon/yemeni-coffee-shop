<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yemeni Coffee & Spice Co.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-gradient { background: linear-gradient(135deg, #2d1b0e 0%, #4a2c17 50%, #6b4423 100%); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .card-hover { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-amber-50 text-stone-800">
    <nav class="bg-stone-900 text-amber-100 px-6 py-4 flex justify-between items-center">
        <a href="/" class="text-2xl font-bold tracking-tight">☕ Yemeni Coffee & Spice Co.</a>
        <div class="space-x-6">
            <a href="/" class="hover:text-amber-300">Shop</a>
            <a href="/admin/login" class="hover:text-amber-300">Admin</a>
        </div>
    </nav>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="bg-amber-200 text-amber-900 px-6 py-2 text-center">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
