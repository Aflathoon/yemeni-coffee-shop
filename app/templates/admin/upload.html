{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Upload Images</h1>

    <div class="bg-white rounded-xl shadow p-6 mb-8">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block text-sm font-semibold mb-1">File</label>
                <input type="file" name="file" accept="image/*" required
                       class="w-full border border-stone-300 rounded-lg px-3 py-2">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Purpose</label>
                <select name="kind" class="w-full border border-stone-300 rounded-lg px-3 py-2">
                    <option value="products">Product image</option>
                    <option value="posts">Post / marketing image</option>
                    <option value="originals">Original (unprocessed)</option>
                </select>
            </div>

            <button type="submit"
                    class="bg-coffee-dark text-amber-50 px-6 py-2 rounded-lg font-bold hover:bg-coffee">
                Upload
            </button>
        </form>
    </div>

    {% for kind, files in gallery.items() %}
    <div class="mb-8">
        <h2 class="text-lg font-bold mb-3">{{ kind|capitalize }} ({{ files|length }})</h2>
        {% if files %}
        <div class="grid grid-cols-4 md:grid-cols-6 gap-3">
            {% for url in files %}
            <div class="relative group">
                <img src="{{ url }}" class="w-full h-24 object-cover rounded shadow" loading="lazy">
                <button onclick="navigator.clipboard.writeText('{{ url }}');this.innerText='Copied!';setTimeout(()=>this.innerText='Copy path',1200)"
                        class="absolute inset-x-1 bottom-1 bg-black/70 text-white text-[10px] py-1 rounded opacity-0 group-hover:opacity-100 transition">
                    Copy path
                </button>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p class="text-sm text-coffee-light">No uploads yet in this category.</p>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% endblock %}
