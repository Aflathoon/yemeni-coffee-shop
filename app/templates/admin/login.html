{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-24 px-6">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold mb-6">Admin Login</h1>
        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-sm font-semibold mb-1">Email</label>
                <input type="email" name="email" required class="w-full border border-stone-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Password</label>
                <input type="password" name="password" required class="w-full border border-stone-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <button type="submit" class="w-full bg-stone-900 text-amber-50 py-3 rounded-lg font-bold hover:bg-stone-700">Login</button>
        </form>
        <p class="text-xs text-stone-500 mt-4">First run? Create an admin user with the CLI command below.</p>
    </div>
</div>
{% endblock %}
